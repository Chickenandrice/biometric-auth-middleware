<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartKey — Nuke Console</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
  <style>
    *{box-sizing:border-box;margin:0}
    body{min-height:100vh;background:#0B0D12;color:#e8ecf4;font-family:'Inter',system-ui,sans-serif}

    /* Brand */
    .brand{position:fixed;top:0;left:0;padding:1rem 1.25rem;display:flex;align-items:center;gap:0.6rem}
    .brand-icon{width:36px;height:36px;border-radius:9px;background:rgba(108,142,239,0.15);display:flex;align-items:center;justify-content:center}
    .brand-icon svg{width:18px;height:18px;color:#6C8EEF}
    .brand-text{font-weight:700;font-size:0.95rem;color:#6C8EEF}

    /* Center */
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}

    /* Card */
    .card{width:100%;max-width:480px;padding:3rem 2.5rem;border-radius:16px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.025);text-align:center}

    /* ECG icon */
    .ecg-icon{width:72px;height:72px;margin:0 auto 1.5rem;border-radius:50%;border:1.5px solid rgba(108,142,239,0.25);display:flex;align-items:center;justify-content:center;color:#6C8EEF;transition:all .4s}
    .ecg-icon svg{width:30px;height:30px}
    .ecg-icon.granted{border-color:rgba(52,211,153,0.35);color:#34D399}
    .ecg-icon.denied{border-color:rgba(224,85,85,0.35);color:#E05555}
    .ecg-icon.scanning{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(108,142,239,0.25)}50%{box-shadow:0 0 0 14px rgba(108,142,239,0)}}

    h1{font-size:1.35rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:0.3rem}
    .subtitle{color:#8b95a8;font-size:0.88rem;margin-bottom:1.25rem}

    /* Bar visualizer */
    .bars{display:none;align-items:center;justify-content:center;gap:3px;height:32px;margin-bottom:1rem}
    .bars.active{display:flex}
    .bar{width:3px;background:#6C8EEF;border-radius:2px;animation:bar .8s ease-in-out infinite alternate}
    .bar:nth-child(1){height:18px;animation-delay:0s}
    .bar:nth-child(2){height:24px;animation-delay:.1s}
    .bar:nth-child(3){height:14px;animation-delay:.2s}
    .bar:nth-child(4){height:28px;animation-delay:.15s}
    .bar:nth-child(5){height:10px;animation-delay:.25s}
    .bar:nth-child(6){height:20px;animation-delay:.05s}
    .bar:nth-child(7){height:8px;animation-delay:.3s}
    .bar:nth-child(8){height:22px;animation-delay:.12s}
    .bar:nth-child(9){height:16px;animation-delay:.22s}
    .bar:nth-child(10){height:12px;animation-delay:.18s}
    .bar:nth-child(11){height:26px;animation-delay:.08s}
    .bar:nth-child(12){height:6px;animation-delay:.28s}
    .bar:nth-child(13){height:18px;animation-delay:.13s}
    .bar:nth-child(14){height:10px;animation-delay:.23s}
    .bar:nth-child(15){height:22px;animation-delay:.06s}
    @keyframes bar{to{height:4px;opacity:.3}}

    /* Status label */
    .status-label{font-size:0.75rem;font-weight:600;letter-spacing:0.1em;color:#6C8EEF;transition:color .3s}
    .status-label:empty{display:none}
    .status-label.granted{color:#34D399}
    .status-label.denied{color:#E05555}

    /* Button */
    .btn{font-family:inherit;font-size:0.95rem;font-weight:600;padding:0.75rem 2rem;border-radius:10px;border:1px solid rgba(108,142,239,0.3);background:rgba(108,142,239,0.12);color:#6C8EEF;cursor:pointer;transition:all .2s;margin-top:1.5rem}
    .btn:hover{background:rgba(108,142,239,0.2)}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn.hidden{display:none}

    /* Result */
    .result{margin-top:1.5rem;display:none;animation:fadeUp .4s ease}
    .result.show{display:block}
    .codes{font-family:'JetBrains Mono',monospace;font-size:0.9rem;color:#34D399;line-height:2;margin-bottom:0.75rem}
    .meta{padding-top:0.65rem;border-top:1px solid rgba(255,255,255,0.06);display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
    .meta span{font-size:0.76rem;color:#8b95a8}
    .meta code{font-family:'JetBrains Mono',monospace;font-size:0.74rem;color:#6C8EEF}

    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    /* Auth0 login card */
    .login-card{width:100%;max-width:480px;padding:3rem 2.5rem;border-radius:16px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.025);text-align:center}
    .login-card .ecg-icon{width:72px;height:72px;margin:0 auto 1.5rem;border-radius:50%;border:1.5px solid rgba(108,142,239,0.25);display:flex;align-items:center;justify-content:center;color:#6C8EEF}
    .login-card .ecg-icon svg{width:30px;height:30px}
    .login-card h1{font-size:1.35rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:0.3rem}
    .login-card .subtitle{color:#8b95a8;font-size:0.88rem;margin-bottom:1.25rem}
    .auth-error{display:none;text-align:left;font-size:0.78rem;line-height:1.45;color:#f0a8a8;background:rgba(224,85,85,0.12);border:1px solid rgba(224,85,85,0.25);border-radius:10px;padding:0.85rem 1rem;margin-bottom:1rem;white-space:pre-wrap}

    /* User badge */
    .user-badge{position:fixed;top:0;right:0;padding:1rem 1.25rem;display:flex;align-items:center;gap:0.6rem}
    .user-badge img{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(108,142,239,0.3)}
    .user-badge .user-name{font-size:0.8rem;color:#8b95a8;font-weight:500}
    .user-badge .logout-btn{font-family:inherit;font-size:0.72rem;font-weight:600;padding:0.3rem 0.6rem;border-radius:6px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#8b95a8;cursor:pointer;transition:all .2s}
    .user-badge .logout-btn:hover{border-color:rgba(224,85,85,0.3);color:#E05555}
    .user-badge .dashboard-link{font-size:0.78rem;font-weight:600;color:#6C8EEF;text-decoration:none;margin-right:0.35rem}
    .user-badge .dashboard-link:hover{text-decoration:underline}

    .hidden-view{display:none}
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h3l3-4 4 8 3-4h3"/>
      </svg>
    </div>
    <span class="brand-text">HeartKey</span>
  </div>

  <!-- User badge (shown when logged in) -->
  <div class="user-badge hidden-view" id="user-badge">
    <img id="user-avatar" src="" alt="">
    <span class="user-name" id="user-name"></span>
    <a class="dashboard-link" href="/dashboard/" target="_blank" rel="noopener">Dashboard</a>
    <button class="logout-btn" onclick="doLogout()">Log out</button>
  </div>

  <!-- Login view -->
  <div class="wrap hidden-view" id="login-view">
    <div class="login-card">
      <div class="ecg-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h4l3-6 4 12 3-6h4"/>
        </svg>
      </div>
      <h1>Nuclear Launch Console</h1>
      <p class="subtitle">Sign in to access the console</p>
      <p id="auth-error" class="auth-error" role="alert"></p>
      <button class="btn" id="login-btn" onclick="doLogin()">Sign In</button>
    </div>
  </div>

  <!-- Console view (shown after login) -->
  <div class="wrap hidden-view" id="console-view">
    <div class="card">
      <div class="ecg-icon" id="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h4l3-6 4 12 3-6h4"/>
        </svg>
      </div>
      <h1 id="title">Nuclear Launch Console</h1>
      <p class="subtitle" id="subtitle">Requires live ECG biometric verification</p>
      <div class="bars" id="bars">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
      <div class="status-label" id="status"></div>
      <button class="btn" id="btn" onclick="launch()">Authenticate</button>
      <div class="result" id="result">
        <div class="codes" id="codes"></div>
        <div class="meta" id="meta"></div>
      </div>
    </div>
  </div>

<script>
/* ── Auth0 Config ── */
let auth0Client = null;
let accessToken = null;
let _redirectUri = null;

function showAuthError(msg) {
  const el = $('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
  $('login-view').classList.remove('hidden-view');
  $('login-btn').disabled = true;
}

async function initAuth0() {
  let cfg;
  try {
    const r = await fetch('/auth-config');
    cfg = await r.json();
  } catch {
    showAuthError('Could not load /auth-config. Is the demo server running on this port?');
    return;
  }
  if (!cfg.configured) {
    showAuthError(
      'Set AUTH0_DOMAIN and AUTH0_CLIENT_ID in the project .env (see .env.example), then restart the demo server.'
    );
    return;
  }
  // OAuth returns here via /landing-page (single callback URL). Optional AUTH0_REDIRECT_URI in .env overrides.
  _redirectUri =
    (cfg.redirectUri && String(cfg.redirectUri).trim()) || window.location.origin + '/landing-page';
  const redirectUri = _redirectUri;
  try {
    auth0Client = await auth0.createAuth0Client({
      domain: cfg.domain,
      clientId: cfg.clientId,
      authorizationParams: { redirect_uri: redirectUri },
      cacheLocation: 'localstorage',
    });
  } catch (e) {
    showAuthError('Auth0 could not start: ' + (e && e.message ? e.message : String(e)));
    return;
  }

  if (window.location.search.includes('code=') && window.location.search.includes('state=')) {
    try {
      await auth0Client.handleRedirectCallback();
      window.history.replaceState({}, document.title, window.location.pathname);
    } catch (e) {
      showAuthError(
        'Auth0 redirect failed: ' + (e && e.message ? e.message : String(e)) +
          '\n\nIn Auth0 Dashboard → Applications → your SPA → Settings:\n' +
          '• Application type: Single Page Application\n' +
          '• Allowed Callback URLs must include this exact string: ' + redirectUri +
          '\n• Allowed Logout URLs: same URL (or add each variant you use)\n' +
          '• Allowed Web Origins: ' + window.location.origin +
          '\n\nIf Auth0 still rejects redirect_uri, set AUTH0_REDIRECT_URI in .env to the same value you paste into Allowed Callback URLs, then restart uvicorn.\n' +
          '127.0.0.1 and localhost are different; trailing slash vs no slash must match.'
      );
      return;
    }
  }

  const loggedIn = await auth0Client.isAuthenticated();
  if (loggedIn) {
    await showConsole();
  } else {
    $('login-view').classList.remove('hidden-view');
  }
}

async function doLogin() {
  await auth0Client.loginWithRedirect();
}

async function doLogout() {
  auth0Client.logout({ logoutParams: { returnTo: _redirectUri || window.location.origin } });
}

async function syncDashboardPrefs() {
  try {
    const cfg = await fetch('/demo-config').then((r) => r.json());
    if (cfg.gatewayUrl) {
      localStorage.setItem('bioauth_dashboard_api_base', cfg.gatewayUrl);
      localStorage.setItem('bioauth_dashboard_api_key', cfg.apiKey || '');
      localStorage.setItem('bioauth_dashboard_use_mock', '0');
    }
  } catch (_) {}
}

async function showConsole() {
  const user = await auth0Client.getUser();
  // Without an API audience, Auth0 often returns an opaque access token; the demo API expects a JWT (RS256).
  const tok = await auth0Client.getTokenSilently({ detailedResponse: true });
  accessToken = tok.id_token || tok.access_token;

  await syncDashboardPrefs();

  // Show user badge
  const badge = $('user-badge');
  $('user-avatar').src = user.picture || '';
  $('user-name').textContent = user.name || user.email || '';
  badge.classList.remove('hidden-view');

  // Swap views
  $('login-view').classList.add('hidden-view');
  $('console-view').classList.remove('hidden-view');
}

initAuth0();
</script>

<script>
const LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-6 4 12 3-6h4"/></svg>'
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>'

async function launch(){
  const btn=$('btn'),icon=$('icon'),bars=$('bars'),status=$('status'),result=$('result')
  btn.classList.add('hidden'); result.className='result'
  icon.className='ecg-icon scanning'; icon.innerHTML=LOCK
  bars.className='bars active'

  const phases=[['Connecting to sensor...','CONNECTING'],['Reading ECG biometric signal...','READING'],['Analyzing biometrics...','ANALYZING'],['Verifying identity...','AUTHENTICATING']]
  for(const [sub,label] of phases){
    $('title').textContent='Verifying Identity'
    $('subtitle').textContent=sub
    status.className='status-label'; status.textContent=label
    await sleep(800+Math.random()*500)
  }

  try{
    const res=await fetch('/launch',{method:'POST',headers:{'Authorization':'Bearer '+accessToken}})
    if(!res.ok) throw new Error(res.status)
    const d=await res.json(),b=d.bioauth
    bars.className='bars'

    $('meta').innerHTML=
      `<span>Decision: <code>${b.decision}</code></span>`+
      `<span>Confidence: <code>${(b.confidence*100).toFixed(0)}%</code></span>`+
      `<span>Reason: <code>${(b.reasons||[]).join(', ')||'—'}</code></span>`

    if(d.authorized){
      icon.className='ecg-icon granted'; icon.innerHTML=CHECK
      $('title').textContent='Access Granted'
      $('subtitle').textContent='Identity confirmed — launch codes released'
      status.className='status-label granted'; status.textContent='AUTHORIZED'
      $('codes').innerHTML=d.codes.map(c=>`\u2622 ${c}`).join('<br>')
      result.className='result show'
    }else{
      icon.className='ecg-icon denied'; icon.innerHTML=X
      $('title').textContent='Access Denied'
      $('subtitle').textContent='Biometric verification failed'
      status.className='status-label denied'; status.textContent='DENIED'
      $('codes').textContent=''
      result.className='result show'
    }
  }catch(e){
    bars.className='bars'
    icon.className='ecg-icon denied'; icon.innerHTML=X
    $('title').textContent='Access Denied'
    $('subtitle').textContent='Could not reach BioAuth — is it running on :8000?'
    status.className='status-label denied'; status.textContent='UNREACHABLE'
  }
  btn.classList.remove('hidden')
}
function $(id){return document.getElementById(id)}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
</script>
</body>
</html>
